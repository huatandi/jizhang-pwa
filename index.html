<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>明细 · 智能记账系统</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智账">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css?v=30">
  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="vendor/sqljs/sql-wasm.js"></script>
</head>

<body>
  <!-- ========== 登录页 ========== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-bg">
      <div class="login-bg-orb orb-1"></div>
      <div class="login-bg-orb orb-2"></div>
      <div class="login-bg-orb orb-3"></div>
    </div>
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">📒</div>
        <h1>智账</h1>
        <p>智能记账 · 离线 PWA</p>
      </div>
      <div class="login-welcome">请选择账本，输入密码进入</div>
      <div class="login-entries">
        <div class="login-entry biz" onclick="pickLoginEntry('business')">
          <div class="login-entry-icon">🏪</div>
          <div class="login-entry-body">
            <b>开店经营</b>
            <small>进货 · 供应商 · 经营报表</small>
          </div>
          <div class="login-entry-arrow">›</div>
        </div>
        <div class="login-entry fam" onclick="pickLoginEntry('family')">
          <div class="login-entry-icon">🏠</div>
          <div class="login-entry-body">
            <b>家庭记账</b>
            <small>日常收支 · 预算 · 健康度</small>
          </div>
          <div class="login-entry-arrow">›</div>
        </div>
      </div>
      <div id="loginForm" class="login-form" hidden>
        <span class="login-entry-title" id="loginEntryTitle">🏪 开店经营</span>
        <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="off">
        <button class="login-btn" onclick="doLogin()">进入账本</button>
        <button class="login-back" onclick="resetLogin()">← 返回选择</button>
        <div id="loginError" class="login-error" hidden></div>
      </div>
      <div class="login-footer">默认密码: 12345 · 数据仅存本地</div>
    </div>
  </div>

  <!-- ========== 主应用 ========== -->
  <div class="app" style="display:none">
    <nav class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-icon">📒</div>
        <div class="logo-text">
          <h1>智账 <button class="mode-switch" id="modeSwitch" onclick="quickSwitchMode()">🏪 开店</button></h1>
          <p>离线 · 智能记账</p>
        </div>
      </div>
      <div class="nav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">📊</span> 数据总览</button>
        <button class="nav-item" data-page="income"><span class="nav-icon">💰</span> 收入</button>
        <button class="nav-item" data-page="expense"><span class="nav-icon">💸</span> 支出</button>
        <button class="nav-item" data-page="purchase"><span class="nav-icon">📦</span> 进货</button>
        <button class="nav-item" data-page="monthly"><span class="nav-icon">📅</span> 月度统计</button>
        <button class="nav-item" data-page="query"><span class="nav-icon">🔍</span> 明细查询</button>
        <button class="nav-item voice-nav-item" data-page="reminder"><span class="nav-icon">⏰</span> 提醒</button>
        <button class="nav-item" data-page="scan"><span class="nav-icon">📷</span> 扫描识别</button>
        <button class="nav-item btn-settings" onclick="openSettingsModal()">⚙️ 设置</button>
      </div>
      <div class="sidebar-footer">
        <div class="date-range-box">
          <label>📅 数据范围</label>
          <input type="date" id="rangeStart">
          <input type="date" id="rangeEnd">
          <button class="btn-small" id="btnApplyRange">应用范围</button>
        </div>
        <button class="btn-logout" onclick="logout()">🚪 退出登录</button>
      </div>
    </nav>
    <main class="main" id="mainContent"></main>
    <nav class="mobile-nav" id="mobileNav">
      <button class="nav-item" data-page="dashboard"><span class="nav-icon">📊</span>总览</button>
      <button class="nav-item" data-page="income"><span class="nav-icon">💰</span>收入</button>
      <button class="nav-item m-add-center" onclick="openQuickModal()"><span class="nav-icon">＋</span>记账</button>
      <button class="nav-item" data-page="expense"><span class="nav-icon">💸</span>支出</button>
      <button class="nav-item m-voice-btn" onclick="openQuickModal(true)"><span class="nav-icon">🎙️</span>语音</button>
    </nav>
  </div>

  <!-- ========== Toast ========== -->
  <div id="toast" class="toast"></div>

  <!-- ========== 页面容器（由 JS 动态渲染） ========== -->
  <div id="pageContainer"></div>

  <!-- ========== 底部加载 ========== -->
  <script src="js/offline-db.js"></script>
  <script src="js/offline-backend.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
